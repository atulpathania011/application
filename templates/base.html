<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Calculus{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="wordmark" href="{{ url_for('dashboard') }}"><span class="integral-sm">&int;</span> Calculus</a>
  <div class="who">
    <span class="co">{{ user.company.name or 'Company not set up' }}</span>
    <span>{{ user.full_name }}</span>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="btn btn-quiet" type="submit">Log out</button>
    </form>
  </div>
</header>
{% endif %}
{% block content %}{% endblock %}
</body>
</html>
